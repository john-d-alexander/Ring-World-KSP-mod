// Add-on authors: append these nodes from your own GameData folder. No DLL edits.
// Matching science-value nodes apply in database order; last match wins.
RINGWORLD_SCIENCE_VALUE
{
    category = biome
    multiplier = 10
}
RINGWORLD_SCIENCE_VALUE
{
    category = landmark
    multiplier = 14
}
RINGWORLD_SCIENCE_VALUE
{
    category = structure
    multiplier = 18
}
RINGWORLD_SCIENCE_VALUE
{
    category = wall
    multiplier = 16
}
RINGWORLD_SCIENCE_VALUE
{
    category = panel
    multiplier = 20
}
RINGWORLD_SCIENCE_VALUE
{
    category = orbit
    multiplier = 6
}

// These are persistent expedition milestones, not Mission Control contracts.
// Only positive science delivered through stock R&D counts. Rewards are once/save.
// Funds/reputation use career difficulty and stock currency transactions.
RINGWORLD_OBJECTIVE
{
    id = first_contact
    title = An artificial world
    description = Transmit or recover any stock experiment from the Ringworld region.
    count = 1
    funds = 150000
    reputation = 15
}
RINGWORLD_OBJECTIVE
{
    id = orbital_recon
    title = Survey before arrival
    description = Return research from space above the ring. A flyby can begin this investigation without landing.
    requires = first_contact
    category = orbit
    funds = 200000
    reputation = 20
}
RINGWORLD_OBJECTIVE
{
    id = atmosphere
    title = Air on the inside
    description = Return atmospheric pressure readings from two different locations in the lower atmosphere.
    requires = first_contact
    zone = lowair
    experiment = barometerScan
    count = 2
    funds = 250000
    reputation = 20
}
RINGWORLD_OBJECTIVE
{
    id = foothold
    title = A foothold on the ribbon
    description = Land and return a crew report. A probe survey alone cannot complete this crewed milestone.
    requires = first_contact
    zone = surface
    experiment = crewReport
    funds = 400000
    reputation = 30
}
RINGWORLD_OBJECTIVE
{
    id = first_steps
    title = Footsteps on scrith
    description = Return an EVA report taken while standing on the surface.
    requires = foothold
    zone = surface
    experiment = evaReport
    funds = 150000
    reputation = 15
}
RINGWORLD_OBJECTIVE
{
    id = samples
    title = Soil of an engineered world
    description = Recover surface samples from three different research locations. Stock sample transmission gives no credit; bring the stored samples home.
    requires = first_steps
    zone = surface
    experiment = surfaceSample
    count = 3
    funds = 500000
    reputation = 40
}
RINGWORLD_OBJECTIVE
{
    id = ecology
    title = The living ribbon
    description = Return landed research from six distinct biomes away from named sites and structures.
    requires = foothold
    zone = surface
    category = biome
    count = 6
    funds = 600000
    reputation = 45
}
RINGWORLD_OBJECTIVE
{
    id = atlas
    title = An explorer's atlas
    description = Return research from four named landmarks. Their coordinates are listed below.
    requires = first_contact
    category = landmark
    count = 4
    funds = 650000
    reputation = 45
}
RINGWORLD_OBJECTIVE
{
    id = archaeology
    title = The builders' legacy
    description = Return research from three distinct structures. Flybys within each structure's research envelope count.
    requires = first_contact
    category = structure
    count = 3
    funds = 750000
    reputation = 50
}
RINGWORLD_OBJECTIVE
{
    id = rim_survey
    title = The edges of the world
    description = Return research from both rim walls, near their structure or on their tops. The terminal at ground level is a separate site.
    requires = first_contact
    category = wall
    count = 2
    funds = 900000
    reputation = 60
}
RINGWORLD_OBJECTIVE
{
    id = shadow_survey
    title = The machinery of night
    description = Return research from near two different shadow squares. These are spaceflight targets, not landing sites.
    requires = orbital_recon
    category = panel
    count = 2
    funds = 1200000
    reputation = 75
}
RINGWORLD_OBJECTIVE
{
    id = gravity
    title = Gravity without a planet
    description = Return gravity scans from three distinct research locations.
    requires = first_contact
    experiment = gravityScan
    count = 3
    funds = 450000
    reputation = 35
}

RINGWORLD_SCIENCE_REPORT
{
    experiment = crewReport
    text = The landscape curves upward until it becomes part of the sky. The crew records the local horizon and the motion of the shadow bands, and requests a larger map.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = evaReport
    text = The suit records local motion and illumination. Standing on an artificial world feels surprisingly ordinary until you look up.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = surfaceSample
    text = Soil grains, weathered fragments and biological material preserve the history of this location. Their relationships to the engineered substrate deserve laboratory examination.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = temperatureScan
    text = Temperature readings record how this part of the habitat exchanges heat through the moving day and night cycle.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = barometerScan
    text = The pressure profile belongs to air retained inside a rotating ribbon. Nearby walls and local altitude matter more than distance from the star.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = gravityScan
    text = The measurements distinguish the central star's gravitational field from the apparent weight experienced in the rotating frame. The two should not be confused.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = seismicScan
    text = Vibrations travel through soil resting on an engineered substrate. The instrument searches for boundaries between natural deposits and buried structure.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = atmosphereAnalysis
    text = The sample records the composition of the habitat's air. Comparing distant environments may reveal how effectively the enormous atmosphere mixes.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = mysteryGoo
    text = The Goo responds to its surroundings with the same scientific ambiguity it displays elsewhere. This particular artificial environment is now part of its research record.
}
RINGWORLD_SCIENCE_REPORT
{
    experiment = mobileMaterialsLab
    text = Exposed materials record the local thermal and radiation environment. Their behaviour will be useful when planning a longer expedition.
}
RINGWORLD_SCIENCE_REPORT
{
    category = structure
    text = The survey records dimensions, weathering and surviving structural elements. This structure is an individual archaeological research site.
}
RINGWORLD_SCIENCE_REPORT
{
    category = panel
    text = This shadow square interrupts sunlight on an extraordinary scale. Its apparent motion can be compared with the timing of night on the habitat below.
}
